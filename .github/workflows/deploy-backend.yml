name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - "Backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Kredibly II Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 157.173.125.29
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            bash /root/Kredibly-II/deploy-backend.sh
